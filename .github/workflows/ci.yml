name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # Runs first and takes seconds: it needs no install, no image and no container.
  # This is the job that exists because of an actual outage — the Traefik `websecure`
  # labels shipped commented out, this service published an HTTP router only, and every
  # https:// request died at the router with a Bad Gateway while the container was
  # healthy. Nothing could have caught it: this repository had no CI, and the backend's
  # smoke suite covers the backend stack only.
  deploy-config:
    name: Deploy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./deploy/verify-compose.sh

  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # --force, not --legacy-peer-deps. Every published @medusajs/ui declares
      # `peer react@^18.3.1` while this storefront runs React 19, so a strict install
      # fails with ERESOLVE. --legacy-peer-deps would skip peer installation entirely
      # rather than tolerating the range, which is a different and worse thing.
      - run: npm ci --force --no-audit --no-fund

      - run: npm run lint

      # Every NEXT_PUBLIC_* is compiled in at build time, and docker-compose.yml guards
      # the required ones with `${...:?}`. These are placeholders: the build must not
      # reach the backend, and nothing here is deployed.
      - name: Build
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
          NEXT_PUBLIC_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_VENDOR_URL: http://localhost:9000/seller
          NEXT_PUBLIC_DEFAULT_REGION: de
        run: npm run build

  # Was a ratchet holding the count at 82, then 71, while the debt was paid down. The
  # count is now zero, so this is a plain gate — and `next.config.ts` no longer sets
  # `typescript.ignoreBuildErrors`, meaning the build enforces it too. Both are kept: this
  # job fails in seconds and names the file, where a build failure is slower and noisier.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --force --no-audit --no-fund

      - run: npx tsc --noEmit
